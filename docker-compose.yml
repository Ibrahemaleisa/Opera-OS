# Local / single-host deployment. Copy .env.example to .env and set real secrets first.
#   docker compose up -d --build
#   docker compose run --rm migrate            # (also runs automatically before app/worker start)
#   docker compose run --rm tools pnpm db:seed # optional synthetic demo data
# project name: legacy identifier, kept so existing deployments and devices keep working (ARCHITECTURE.md §10) (volume names derive from it)
name: operra

x-env: &app-env
  DATABASE_URL: postgresql://${APP_DB_USER:-operra_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-operra}?connection_limit=20
  MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-operra}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-operra}
  DATABASE_APP_ROLE: ${APP_DB_USER:-operra_app}
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  APP_URL: ${APP_URL:-http://localhost:3000}
  APP_SECRET: ${APP_SECRET:?set APP_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_DIR: /app/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  UNIFONIC_APP_SID: ${UNIFONIC_APP_SID:-}
  UNIFONIC_SENDER_ID: ${UNIFONIC_SENDER_ID:-}
  WHATSAPP_CLOUD_TOKEN: ${WHATSAPP_CLOUD_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WEBHOOK_SECRET_SIMULATION: ${WEBHOOK_SECRET_SIMULATION:-}
  WEBHOOK_SECRET_UNIFONIC: ${WEBHOOK_SECRET_UNIFONIC:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-operra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-operra}
      APP_DB_USER: ${APP_DB_USER:-operra_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: ., target: tools }
    environment: *app-env
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: app }
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: { context: ., target: tools }
    environment: *app-env
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  tools:
    build: { context: ., target: tools }
    environment: *app-env
    volumes:
      - storage:/app/storage
    profiles: ["tools"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
